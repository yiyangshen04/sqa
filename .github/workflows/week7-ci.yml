name: week7

on:
  push:
  pull_request:

jobs:
  week7:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install pytest pytest-cov pytest-playwright
          python -m playwright install --with-deps chromium

      - name: Test with pytest
        run: pytest week7 --junitxml=junit.xml --cov=week7 --cov-report=xml

  performance:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 test
        run: k6 run week7/performance_test.js
